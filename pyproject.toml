[project]
name = "kafka-clickstream-pipeline"
version = "0.1.0"
description = "Real-time clickstream sessionization on Kafka: validation, DLQ, windowed aggregation, Parquet sink."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Druva Sai Kumar Bobbilla" }]
dependencies = ["confluent-kafka>=2.3", "pyarrow>=15.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 105

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
